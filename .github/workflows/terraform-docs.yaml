name: Update Terraform documentation

on:
  pull_request:
  push:
    branches:
      - 2/edge

jobs:
  terraform-docs:
    name: Update Terraform documentation
    uses: canonical/operator-workflows/.github/workflows/generate_terraform_docs.yaml@main
    permissions:
      contents: write
      pull-requests: write
    secrets: inherit
    with:
      terraform-directory: terraform,terraform/charm,terraform/product
